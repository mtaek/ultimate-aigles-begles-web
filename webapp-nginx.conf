# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name aiglesdebegles.aquilenet.fr;
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    server_name aiglesdebegles.aquilenet.fr;

    ssl_certificate /etc/letsencrypt/live/aiglesdebegles.aquilenet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiglesdebegles.aquilenet.fr/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Redirection UltiTimer vers l'application externe
    location /ultitimer-app/ {
        return 301 https://ultitimer.appwrite.network/;
    }

    # ----- Application React via Docker -----
    location / {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ----- Site classique sous /website/ -----
    location /website/ {
        alias /var/www/website/;
        try_files $uri $uri/ =404;
    }

    # ----- Zulip sous /zulip/ -----
    location /zulip/ {
        proxy_pass http://127.0.0.1:9991/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

