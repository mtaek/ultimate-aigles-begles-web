server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Redirections relatives : derrière le proxy HTTPS, ne pas renvoyer vers http://hote:80/
    absolute_redirect off;

    # Outil Ulti-Tactics (page autonome générée dans dist/ulti-tactics/)
    location = /ulti-tactics {
        return 301 /ulti-tactics/$is_args$args;
    }

    location ^~ /ulti-tactics/ {
        try_files $uri $uri/ /ulti-tactics/index.html;
    }

    location = /ulti-tactics/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /ultitimer-app {
        return 301 https://ultitimer.appwrite.network/;
    }

    location = /ultitimer-app/ {
        return 301 https://ultitimer.appwrite.network/;
    }

    location ^~ /ultitimer-app/ {
        return 301 https://ultitimer.appwrite.network/;
    }

    # Composition des équipes BAB'HAT : jamais indexée par les moteurs
    location ~* ^/images/babhat/.*/equipes\.[a-z]+$ {
        add_header X-Robots-Tag "noindex, noimageindex, noarchive" always;
        add_header Cache-Control "no-cache";
    }

    # Gestion du routing React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Désactiver le cache pour index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}
